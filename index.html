<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .image-container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .buttons {
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: black;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="image-container">
        <img id="mainImage" src="Love Story/Image1.png" alt="Image">
    </div>

    <div class="buttons">
        <button id="previousButton" onclick="previousImage()">
            Previous Page
        </button>

        <button id="nextButton" onclick="nextImage()">
            Next Page
        </button>
    </div>

    <script>

        // Total number of images
        const totalImages = 13;

        // Current image
        let currentImage = 1;

        const mainImage = document.getElementById("mainImage");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");

        function showImage() {

            mainImage.src = "Love Story/Image" + currentImage + ".png";

            // Disable Previous button on first image
            if (currentImage === 1) {
                previousButton.disabled = true;
            } else {
                previousButton.disabled = false;
            }

            // Disable Next button on last image
            if (currentImage === totalImages) {
                nextButton.disabled = true;
            } else {
                nextButton.disabled = false;
            }
        }

        function nextImage() {

            if (currentImage < totalImages) {
                currentImage++;
                showImage();
            }
        }

        function previousImage() {

            if (currentImage > 1) {
                currentImage--;
                showImage();
            }
        }

        // Show first image when website opens
        showImage();

    </script>

</body>
</html>
